name: Python - Pre Commit Checks
on:
  - push

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit ruff

      - name: Run Pre-commit Hooks
        uses: pre-commit/action@v3.0.0
        id: precommit-id
        with:
          extra_args: --all-files --verbose
        continue-on-error: true

      - name: Commit Changes from Pre-commit Hooks
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          if ! git diff --quiet HEAD; then
            echo "Changes detected by pre-commit, committing..."
            git add -A
            git commit -m "style: Apply pre-commit fixes" -m "Applied fixes from pre-commit hooks"
            echo "Pushing changes..."
            git push origin HEAD:${{ github.ref }}
          else
            echo "No changes detected by pre-commit."
          fi
